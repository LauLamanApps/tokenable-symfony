version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # jenssegers/optimus (Energon triplet generation) only works with phpseclib 2.x
      # — it uses Crypt\Random and BigInteger::randomPrime(), removed in 3.0.
      - dependency-name: "phpseclib/phpseclib"
        update-types: ["version-update:semver-major"]
    groups:
      symfony:
        patterns:
          - "symfony/*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
